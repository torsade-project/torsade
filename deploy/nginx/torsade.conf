# torsade/deploy/nginx/torsade.conf
#
# Site of Torsade. MANAGED BY TORSADE: the installation writes this file and
# every update rewrites it, so a change made here is lost. Put your own
# directives in /etc/torsade/nginx-local.conf, included in the HTTPS server
# below and never rewritten.

# Attempts to sign in, by client address: ten a minute, after a burst of
# five, on top of the limit of the application. Only the POST requests count.
map $request_method $torsade_sign_in {
    POST $binary_remote_addr;
    default "";
}

limit_req_zone $torsade_sign_in zone=torsade_sign_in:10m rate=10r/m;

# HTTP only leads to HTTPS, on the name of the application.
server {
    listen 80;
    @IPV6@listen [::]:80;
    server_name @HOST@;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        return 301 https://@HOST@$request_uri;
    }
}

server {
    listen 443 ssl;
    @IPV6@listen [::]:443 ssl;
    http2 on;
    server_name @HOST@;
    server_tokens off;

    root /opt/torsade/current/public;
    index index.php;
    charset utf-8;

    # The application receives forms, never files.
    client_max_body_size 1m;

    # TLS after the recommendations of the ANSSI on TLS: TLS 1.3 preferred
    # and TLS 1.2 accepted; authenticated encryption only, with ECDHE on
    # the recommended curves; the order of the server; no session resumed,
    # no data before the handshake ends.
    ssl_certificate /etc/torsade/tls/torsade.crt;
    ssl_certificate_key /etc/torsade/tls/torsade.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-CCM:ECDHE-ECDSA-AES128-CCM:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_AES_128_CCM_SHA256:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve prime256v1:secp384r1:secp521r1:X25519:X448;
    ssl_session_cache off;
    ssl_session_tickets off;
    ssl_early_data off;

    # On every answer, the files of the build, the redirections and the
    # errors Laravel never sees included. No location below adds a header
    # of its own, which would drop these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    include /etc/torsade/nginx-local.conf;

    # No hidden file is ever served.
    location ~ /\. {
        return 404;
    }

    # The files of the build carry their digest in their name: a long cache.
    location /build/ {
        expires max;
        try_files $uri =404;
    }

    location = /login {
        limit_req zone=torsade_sign_in burst=5 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location = /two-factor-challenge {
        limit_req zone=torsade_sign_in burst=5 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # The only script executed, by the real path of the version: a switch
    # of the current version is seen at once.
    location = /index.php {
        fastcgi_pass unix:/run/php/torsade-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # The headers of a page must fit in the first buffer, 4 KB by
        # default, or Nginx answers 502: those of the pages of the
        # application already exceed it, the Link header that preloads the
        # files of the build growing with each page. Room for all of them;
        # the other buffers grow with it, as Nginx requires.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        # Set above for every answer: the copies the application sends
        # would otherwise appear twice.
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Robots-Tag;
        fastcgi_hide_header Cross-Origin-Resource-Policy;
        fastcgi_hide_header Cross-Origin-Opener-Policy;
        fastcgi_hide_header X-Powered-By;
    }

    # Any other PHP file is never executed, nor served.
    location ~ \.php$ {
        return 404;
    }
}
