# torsade/deploy/nginx/nginx-local.conf
#
# /etc/torsade/nginx-local.conf: your own directives for the HTTPS server
# of Torsade, which includes this file. The installation creates it once;
# no update ever rewrites it. After a change: nginx -t, then
# systemctl reload nginx.
#
# Behind a reverse proxy, the real address of the client, for the limit of
# the attempts to sign in and for the logs, from the same addresses as
# TRUSTED_PROXIES in /etc/torsade/torsade.env:
#
# set_real_ip_from 192.0.2.1;
# real_ip_header X-Forwarded-For;
