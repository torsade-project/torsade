; torsade/deploy/php/torsade-pool.conf
;
; Pool of PHP-FPM for Torsade. MANAGED BY TORSADE: the installation writes
; this file and every update rewrites it.

[torsade]
user = torsade
group = torsade

; Only Nginx, which runs as www-data, may open the socket.
listen = /run/php/torsade-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0600

; A handful of people at a time: processes start on demand and stop when
; idle.
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

security.limit_extensions = .php

; Errors are logged by PHP-FPM, never shown; Laravel logs its own in
; /var/log/torsade. The forms of the application are small.
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 1M
php_admin_value[upload_max_filesize] = 1M
php_admin_value[max_execution_time] = 60
