; torsade/deploy/php/90-torsade.ini
;
; Settings of production of PHP-FPM for Torsade. MANAGED BY TORSADE: the
; installation writes this file and every update rewrites it.

; Nothing about the version of PHP goes out, and no error reaches a page.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
zend.exception_ignore_args = On

; The compiled code stays in memory. The files of a version never change:
; every switch of version, and every rebuild of a cache, reloads PHP-FPM,
; which empties it.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
