# torsade/.github/dependabot.yml
version: 2
updates:
  # Only the GitHub Actions used by the workflows: they are pinned by commit
  # SHA, so nothing else tells when a new release is out. One grouped pull
  # request a month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
